name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Build + Upload Artifacts Only ───
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: --bundles nsis
            rustTargets: ''

          - name: Windows ARM64
            platform: windows-latest
            args: --target aarch64-pc-windows-msvc --bundles nsis
            rustTargets: aarch64-pc-windows-msvc

          - name: Linux x64
            platform: ubuntu-22.04
            args: --bundles appimage,deb,rpm
            rustTargets: ''

          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin

          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync tag version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: npm run version:set -- ${GITHUB_REF_NAME#v}

      - name: Build frontend
        run: npm run build

      - name: Set CI package name
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(path, "utf8"));
            conf.productName = "coolapk-desktop";
            fs.writeFileSync(path, JSON.stringify(conf, null, 2));
          '

      - name: Build and upload artifact
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: '[platform]-[arch]-[bundle]'
