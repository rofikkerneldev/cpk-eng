name: CI Win64

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync tag version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: npm run version:set -- ${GITHUB_REF_NAME#v}

      - name: Build frontend
        run: npm run build

      - name: Set CI package name
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(path, "utf8"));
            conf.productName = "coolapk-desktop";
            fs.writeFileSync(path, JSON.stringify(conf, null, 2));
          '

      - name: Build and upload Windows x64 artifact
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: 'windows-x64-nsis'
